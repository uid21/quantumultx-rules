name: Update Bilibili PCDN rules

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'sources/**'
      - '.github/workflows/update-bilibili-pcdn.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'sources/**'
      - '.github/workflows/update-bilibili-pcdn.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  update:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: update-bilibili-pcdn
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_bilibili_pcdn.py
      - name: Commit changed rules only
        shell: bash
        run: |
          git add quantumultx/filter/bilibili-pcdn.list quantumultx/filter/bilibili-pcdn-extended.list sources/bilibili-pcdn-lock.json
          if git diff --cached --quiet; then
            echo 'No upstream changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Bilibili PCDN rules'
          git push origin HEAD:main
