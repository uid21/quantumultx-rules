# Claude iOS login-state reset (temporary)
# Enable only long enough to relaunch Claude and reach the login screen.
# Disable this rewrite resource immediately after the login screen appears.

hostname = claude.ai, a-api.anthropic.com

^https:\/\/claude\.ai\/api\/account(?:[\/?#]|$) url script-echo-response https://raw.githubusercontent.com/uid21/quantumultx-rules/main/quantumultx/scripts/claude-ios-reset.js
^https:\/\/a-api\.anthropic\.com(?:[\/?#]|$) url script-echo-response https://raw.githubusercontent.com/uid21/quantumultx-rules/main/quantumultx/scripts/claude-ios-reset.js
